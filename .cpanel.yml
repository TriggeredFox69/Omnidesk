---
# cPanel Git™ Version Control Automated Deployment Recipe
# Chatly production deployment to chatly.pk and omnidesk.lalagpt.pk
deployment:
  tasks:
    # 1. Primary shell deployment runner
    - /bin/bash ./deploy.sh 2>/dev/null || true

    # 2. Direct absolute copy for chatly.pk (Zero dependency on env vars)
    - /bin/mkdir -p /home/dailygol/chatly.pk/api /home/dailygol/chatly.pk/assets /home/dailygol/chatly.pk/bridge /home/dailygol/chatly.pk/data /home/dailygol/chatly.pk/cc /home/dailygol/chatly.pk/ss
    - /bin/cp -rf api/* /home/dailygol/chatly.pk/api/ 2>/dev/null || true
    - /bin/cp -rf assets/* /home/dailygol/chatly.pk/assets/ 2>/dev/null || true
    - /bin/cp -rf cc/* /home/dailygol/chatly.pk/cc/ 2>/dev/null || true
    - /bin/cp -rf ss/* /home/dailygol/chatly.pk/ss/ 2>/dev/null || true
    - /bin/cp -f index.php index.html login.php admin.php sadmin.php cc.php ss.php email_hub.php terms.php robots.txt sitemap.xml open-omnidesk.html README.md LOCAL-TEST.md /home/dailygol/chatly.pk/ 2>/dev/null || true
    - /bin/cp -R bridge/dist /home/dailygol/chatly.pk/bridge/ 2>/dev/null || true
    - /bin/cp -f bridge/*.js bridge/*.sh bridge/package.json /home/dailygol/chatly.pk/bridge/ 2>/dev/null || true
    - /bin/chmod +x /home/dailygol/chatly.pk/bridge/*.sh 2>/dev/null || true
    - /bin/cp -f .htaccess /home/dailygol/chatly.pk/ 2>/dev/null || true
    - /bin/cp -f data/.htaccess /home/dailygol/chatly.pk/data/ 2>/dev/null || true
    - /bin/chmod 755 /home/dailygol/chatly.pk /home/dailygol/chatly.pk/cc /home/dailygol/chatly.pk/ss 2>/dev/null || true
    - /bin/chmod 775 /home/dailygol/chatly.pk/data 2>/dev/null || true

    # 3. Direct absolute copy for public_html/chatly.pk (Add-on domain root)
    - /bin/mkdir -p /home/dailygol/public_html/chatly.pk/api /home/dailygol/public_html/chatly.pk/assets /home/dailygol/public_html/chatly.pk/bridge /home/dailygol/public_html/chatly.pk/data /home/dailygol/public_html/chatly.pk/cc /home/dailygol/public_html/chatly.pk/ss
    - /bin/cp -rf api/* /home/dailygol/public_html/chatly.pk/api/ 2>/dev/null || true
    - /bin/cp -rf assets/* /home/dailygol/public_html/chatly.pk/assets/ 2>/dev/null || true
    - /bin/cp -rf cc/* /home/dailygol/public_html/chatly.pk/cc/ 2>/dev/null || true
    - /bin/cp -rf ss/* /home/dailygol/public_html/chatly.pk/ss/ 2>/dev/null || true
    - /bin/cp -f index.php index.html login.php admin.php sadmin.php cc.php ss.php email_hub.php terms.php robots.txt sitemap.xml open-omnidesk.html README.md LOCAL-TEST.md /home/dailygol/public_html/chatly.pk/ 2>/dev/null || true
    - /bin/cp -R bridge/dist /home/dailygol/public_html/chatly.pk/bridge/ 2>/dev/null || true
    - /bin/cp -f bridge/*.js bridge/*.sh bridge/package.json /home/dailygol/public_html/chatly.pk/bridge/ 2>/dev/null || true
    - /bin/chmod +x /home/dailygol/public_html/chatly.pk/bridge/*.sh 2>/dev/null || true
    - /bin/cp -f .htaccess /home/dailygol/public_html/chatly.pk/ 2>/dev/null || true
    - /bin/cp -f data/.htaccess /home/dailygol/public_html/chatly.pk/data/ 2>/dev/null || true
    - /bin/chmod 755 /home/dailygol/public_html/chatly.pk /home/dailygol/public_html/chatly.pk/cc /home/dailygol/public_html/chatly.pk/ss 2>/dev/null || true
    - /bin/chmod 775 /home/dailygol/public_html/chatly.pk/data 2>/dev/null || true
