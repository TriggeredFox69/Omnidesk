---
# cPanel Git™ Version Control Automated Deployment Recipe
# When you click 'Deploy HEAD Commit' in cPanel, it syncs files to your web root.
deployment:
  tasks:
    # Adjust DEPLOYPATH to match your cPanel username and directory
    # For main domain: /home/YOUR_CPANEL_USER/public_html/
    # For subdirectory: /home/YOUR_CPANEL_USER/public_html/nunno_whatsapp/
    # For subdomain: /home/YOUR_CPANEL_USER/wa.nunno.cloud/
    - export DEPLOYPATH=/home/$USER/public_html/nunno_whatsapp/
    - /bin/mkdir -p $DEPLOYPATH
    - /bin/cp -R * $DEPLOYPATH
    - /bin/mkdir -p $DEPLOYPATH/data
    - /bin/chmod 755 $DEPLOYPATH
    - /bin/chmod 775 $DEPLOYPATH/data
